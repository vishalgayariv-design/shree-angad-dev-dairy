name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p project
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found"
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          unzip -q "$ZIP" -d project

      - name: Find Android project
        run: |
          SETTINGS=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found"
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")
          echo "ANDROID_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Android project: $ROOT"

      - name: Prepare Gradle Wrapper
        run: |
          cd "$ANDROID_ROOT"

          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi

          chmod +x gradlew
      - name: Fix Google Maps links
        run: |
          cd "$ANDROID_ROOT"
          python3 - <<'PY'
          from pathlib import Path

          p = next(Path("app/src/main/java").rglob("MainActivity.java"))
          s = p.read_text()

          if "import android.content.Intent;" not in s:
              s = s.replace(
                  "import android.app.Activity;",
                  "import android.app.Activity;\nimport android.content.Intent;\nimport android.net.Uri;\nimport android.webkit.WebResourceRequest;"
              )

          old = "webView.setWebViewClient(new WebViewClient());"

          new = """webView.setWebViewClient(new WebViewClient() {
              @Override
              public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                  Uri uri = request.getUrl();
                  String url = uri.toString();

                  if (url.startsWith("intent://") ||
                      url.startsWith("https://www.google.com/maps") ||
                      url.startsWith("http://maps.google.com") ||
                      url.startsWith("geo:")) {
                      try {
                          Intent intent = url.startsWith("intent://")
                                  ? Intent.parseUri(url, Intent.URI_INTENT_SCHEME)
                                  : new Intent(Intent.ACTION_VIEW, uri);
                          startActivity(intent);
                      } catch (Exception ignored) {}
                      return true;
                  }

                  return false;
              }
          });"""

          if old not in s:
              raise SystemExit("WebViewClient line not found")

          s = s.replace(old, new)
          p.write_text(s)
          print("Google Maps WebView fix applied:", p)
          PY
      - name: Build APK
        run: |
          cd "$ANDROID_ROOT"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shree-Angad-Dev-Dairy-APK
          path: |
            ${{ env.ANDROID_ROOT }}/app/build/outputs/apk/debug/*.apk
