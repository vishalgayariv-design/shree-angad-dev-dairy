name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p project
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          echo "ZIP=$ZIP"
          if [ -z "$ZIP" ]; then
            echo "No ZIP file found"
            exit 1
          fi
          unzip -q "$ZIP" -d project

      - name: Find Gradle wrapper
        run: |
          GRADLEW=$(find project -type f -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found"
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi

          ANDROID_ROOT=$(dirname "$GRADLEW")
          echo "ANDROID_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "Gradle wrapper found at: $GRADLEW"

      - name: Build APK
        run: |
          cd "$ANDROID_ROOT"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shree-Angad-Dev-Dairy-APK
          path: "${{ env.ANDROID_ROOT }}/app/build/outputs/apk/debug/app-debug.apk"
